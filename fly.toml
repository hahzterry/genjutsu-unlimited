# Fly.io config for higgsfield-genjutsu-unlimited
# Deploy:  fly deploy --image <built-image>  OR  fly deploy (builds from Dockerfile)
# Scale:    fly scale count N   (N = number of VMs, each runs MAX_WORKERS browsers)
# Logs:     fly logs
# SSH:      fly ssh
#
# Why Fly.io over Railway:
#   - No hour limits (Railway hobby has ~500h/mo cap)
#   - Can scale to N VMs horizontally
#   - 1GB shared VM ~$2.3/mo, 2GB ~$4.6/mo
#   - Built-in health checks + auto-restart

app = "higgsfield-genjutsu-unlimited"
primary_region = "iad"  # US East — change to your nearest region

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep VMs running for instant generation
  auto_start_machines = true
  min_machines_running = 1     # always have at least 1 VM ready

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

# VM spec — 1GB RAM is minimum for headless Chromium + Playwright.
# For MAX_WORKERS=2, use 2GB (shared-cpu-2x). For 4+ workers, use 4GB.
[[vm]]
  size = "shared-cpu-2x"   # 2GB RAM, 2 vCPU — enough for 2 concurrent workers
  memory = 2048

# Environment variables — set secrets with: fly secrets set KEY=value
# fly secrets set API_KEY=your-secret-key
# fly secrets set PROXY_LIST=socks5://user:pass@host:port,socks5://user2:pass2@host2:port2
# fly secrets set CORS_ORIGINS=https://higgsfield-genjutsu-unlimited.vercel.app
[env]
  HEADLESS = "true"
  BROWSER_LOCALE = "en-US"
  MAX_WORKERS = "2"
  RUN_TIMEOUT = "300"
  JOB_TTL = "3600"
  RATE_LIMIT = "0"
